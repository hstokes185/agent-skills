# Canonical CI workflow — copy this file verbatim into new projects.
# Place at .github/workflows/ci.yml.
#
# Gates, in order: lint → type-check → tests.
# CI does NOT run ruff format — formatting is enforced by pre-commit only.
name: CI

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3

      - name: Install dependencies
        run: uv sync

      - name: Lint and format check
        run: uv run ruff check .

      - name: Type check
        run: uv run mypy src

      - name: Tests
        run: uv run pytest
